name: nodeguard

include:
  - ./bitcoin/docker-compose.polar.yml

services:
  nbxplorer:
    restart: unless-stopped
    # Must carry the POST form of the custom selectutxos endpoint (Elenpay/NBXplorer): NodeGuard moves
    # the ignored-outpoint list into a request body once it outgrows the request line, and a GET-only
    # build answers 405 there. LargeIgnoreListCoinSelectionE2ETests probes the route and names this pin
    # when it is missing. TODO before merging the POST transport: repin to the IMMUTABLE tag of the
    # build that carries the route — compose does not re-pull a tag it already has locally, so a
    # floating one lets a stale copy keep serving the GET-only route.
    image: ghcr.io/elenpay/nbxplorer:elenpay-develop
    platform: linux/amd64
    hostname: nbxplorer
    ports:
      - "32838:32838"
    depends_on:
      - postgres
      - bitcoind
    environment:
      NBXPLORER_NETWORK: regtest
      NBXPLORER_BIND: 0.0.0.0:32838
      NBXPLORER_TRIMEVENTS: 10000
      NBXPLORER_SIGNALFILESDIR: /datadir
      NBXPLORER_POSTGRES: User ID=postgres;Host=postgres;Port=5432;Database=nbxplorer;
      NBXPLORER_CHAINS: "btc"
      NBXPLORER_BTCRPCUSER: "polaruser"
      NBXPLORER_BTCRPCPASSWORD: "polarpass"
      NBXPLORER_BTCRPCURL: http://bitcoind:18443
      NBXPLORER_BTCNODEENDPOINT: bitcoind:18444
      NBXPLORER_CUSTOMKEYPATHTEMPLATE: "2/*/0"
    command: ["--noauth"]
    volumes:
      - "bitcoin_datadir:/root/.bitcoin"
      - "nbxplorer_datadir:/datadir"
    healthcheck:
      # Check via /proc/net if we are connected to the bitcoin node at port 18444.
      # NOTE: this could be improved by calling curl <endpoint> but this machine does not have it
      # installed.
      test:
        [
          "CMD-SHELL",
          "cat /proc/net/tcp /proc/net/tcp6 | awk '{print $3}' | grep $(printf ':%X' 18444)",
        ]
      interval: 1s
      timeout: 3m
      retries: 180

  postgres:
    container_name: postgres
    image: postgres:16
    restart: always
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: Europe/Madrid
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 25432:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
  bitcoin_datadir:
  nbxplorer_datadir: