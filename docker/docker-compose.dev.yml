name: nodeguard

include:
  - ./bitcoin/docker-compose.polar.yml

services:
  # By default nbxplorer talks to the `bitcoind` service of the in-repo polar stack
  # (`--profile polar`). The BITCOIND_* variables let it point at an already-running regtest
  # instead — see the `external` profile in ./bitcoin/docker-compose.external.yml.
  nbxplorer:
    restart: unless-stopped
    # Must carry the POST form of the custom selectutxos endpoint (Elenpay/NBXplorer): NodeGuard moves
    # the ignored-outpoint list into a request body once it outgrows the request line, and a GET-only
    # build answers 405 there. LargeIgnoreListCoinSelectionE2ETests probes the route and names this pin
    # when it is missing. TODO before merging the POST transport: repin to the IMMUTABLE tag of the
    # build that carries the route — compose does not re-pull a tag it already has locally, so a
    # floating one lets a stale copy keep serving the GET-only route.
    image: ghcr.io/elenpay/nbxplorer:elenpay-develop
    platform: linux/amd64
    hostname: nbxplorer
    ports:
      - "32838:32838"
    depends_on:
      postgres:
        condition: service_started
      # `required: false` so the project stays valid when the polar profile is off and the
      # chain is provided externally — without it compose errors with
      # "service nbxplorer depends on undefined service bitcoind".
      bitcoind:
        condition: service_started
        required: false
    # Lets BITCOIND_HOST=host.docker.internal reach the host on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NBXPLORER_NETWORK: regtest
      NBXPLORER_BIND: 0.0.0.0:32838
      NBXPLORER_TRIMEVENTS: 10000
      NBXPLORER_SIGNALFILESDIR: /datadir
      NBXPLORER_POSTGRES: User ID=postgres;Host=postgres;Port=5432;Database=nbxplorer;
      NBXPLORER_CHAINS: "btc"
      NBXPLORER_BTCRPCUSER: "${BITCOIND_RPCUSER:-polaruser}"
      NBXPLORER_BTCRPCPASSWORD: "${BITCOIND_RPCPASSWORD:-polarpass}"
      NBXPLORER_BTCRPCURL: http://${BITCOIND_HOST:-bitcoind}:${BITCOIND_RPC_PORT:-18443}
      NBXPLORER_BTCNODEENDPOINT: ${BITCOIND_HOST:-bitcoind}:${BITCOIND_P2P_PORT:-18444}
      NBXPLORER_CUSTOMKEYPATHTEMPLATE: "2/*/0"
      # Only consumed by the healthcheck below, NBXplorer ignores it.
      BITCOIND_P2P_PORT: ${BITCOIND_P2P_PORT:-18444}
    command: ["--noauth"]
    volumes:
      - "bitcoin_datadir:/root/.bitcoin"
      - "nbxplorer_datadir:/datadir"
    healthcheck:
      # Check via /proc/net if we are connected to the bitcoin node at its p2p port.
      # NOTE: this could be improved by calling curl <endpoint> but this machine does not have it
      # installed.
      test:
        [
          "CMD-SHELL",
          "cat /proc/net/tcp /proc/net/tcp6 | awk '{print $3}' | grep $$(printf ':%X' $$BITCOIND_P2P_PORT)",
        ]
      interval: 1s
      timeout: 3m
      retries: 180

  postgres:
    container_name: postgres
    image: postgres:16
    restart: always
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: Europe/Madrid
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 25432:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
  bitcoin_datadir:
  nbxplorer_datadir: